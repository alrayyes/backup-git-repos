# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: backup-git-repos
    main: ./cmd/backup-git-repos
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# .deb/.rpm for linux amd64/arm64, attached to the GitHub release the same
# way the .tar.gz archives already are -- no separate repository to host,
# unlike aurs below, since GitHub Packages doesn't serve either format
# (rules/releases.md).
nfpms:
  - id: backup-git-repos
    package_name: backup-git-repos
    homepage: "https://github.com/alrayyes/backup-git-repos"
    description: >-
      Backs up every repository on a self-hosted GitLab or Forgejo instance,
      or a GitHub.com account, to a local, restorable copy.
    maintainer: "Ryan Kes <ryan@andthensome.nl>"
    license: "GPL-3.0-only"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/backup-git-repos/LICENSE

# Pushes an updated PKGBUILD to a new aur.archlinux.org/backup-git-repos-bin
# git repo on every release. "-bin" is AUR's own naming convention for a
# package that installs a prebuilt binary rather than compiling from
# source, which is exactly what this downloads and installs -- distinct
# from a hypothetical source-build "backup-git-repos" package this isn't.
# private_key reads AUR_KEY as the literal key content, not a path -- set
# from the AUR_SSH_KEY repo secret in release.yml.
aurs:
  - name: backup-git-repos-bin
    homepage: "https://github.com/alrayyes/backup-git-repos"
    description: >-
      Backs up every repository on a self-hosted GitLab or Forgejo instance,
      or a GitHub.com account, to a local, restorable copy.
    maintainers:
      - "Ryan Kes <ryan@andthensome.nl>"
    license: "GPL3"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/backup-git-repos-bin.git"
    provides:
      - backup-git-repos
    conflicts:
      - backup-git-repos
    package: |-
      install -Dm755 ./backup-git-repos "${pkgdir}/usr/bin/backup-git-repos"
      install -Dm644 ./LICENSE "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"

# dockers_v2 (buildx-backed) rather than the older dockers/docker_manifests
# pair: one entry with a platforms list builds and pushes a single
# multi-arch manifest directly, instead of building a same-arch image per
# platform and stitching them together by hand afterwards. darwin isn't in
# platforms: Docker doesn't run macOS containers, so the darwin archives
# above are the only artifact for it.
dockers_v2:
  - ids:
      - backup-git-repos
    dockerfile: Dockerfile
    images:
      - ghcr.io/alrayyes/backup-git-repos
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/alrayyes/backup-git-repos
      org.opencontainers.image.revision: "{{ .FullCommit }}"

# release-please writes the release notes from Conventional Commits and
# creates the GitHub release; goreleaser only hangs binaries on it. Left on,
# the release would carry the notes twice, and release.mode's default of
# keep-existing is what stops goreleaser from replacing the curated ones with
# a raw shortlog.
changelog:
  disable: true
