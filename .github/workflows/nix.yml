name: Nix

# The Nix flake pins vendorHash, which goes stale whenever go.mod or go.sum
# change, so a broken flake can merge unnoticed. `Nix flake check` is meant to
# be a required status check on main (#316).
#
# A required check has to report on every pull request, and a `paths:` filter on
# the workflow would leave it pending forever on the ones that don't touch the
# flake. So it triggers on every pull request, and the `changes` job decides
# whether the check job runs: a skipped job counts as a pass, the same pattern
# as govulncheck in lint.yml. A push to main is still path-filtered, since
# nothing is waiting on it there.
on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - go.mod
      - go.sum
      - .github/workflows/nix.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes (nix)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nix: ${{ steps.groups.outputs.nix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: groups
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          nix=true
          if [ "${EVENT}" = pull_request ]; then
            files=$(git diff --name-only "${BASE}...HEAD")
            printf '%s\n' "${files}" | grep -Eq '^(flake\.nix|flake\.lock|go\.mod|go\.sum|\.github/workflows/nix\.yml)$' || nix=false
          fi
          printf 'nix=%s\n' "${nix}" >> "$GITHUB_OUTPUT"

  nix-flake-check:
    name: Nix flake check
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4

      - run: nix flake check --print-build-logs

      - run: nix build --print-build-logs
