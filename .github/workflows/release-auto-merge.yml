# release-please has no built-in auto-merge, same gap as Dependabot, same
# fix: gate on the label release-please itself applies, wait for the same
# checks every other pull request waits for, then arm auto-merge the same
# way a human would from the UI. Label rather than actor: release.yml uses
# RELEASE_TOKEN to dodge the action_required wall, so this PR is opened as
# alrayyes, not github-actions[bot] -- an actor check has to name that
# identity explicitly and breaks again if it ever changes, where the label
# release-please itself applies doesn't care who opened the PR at all.
# Same pattern as hush-hush-action's and washy-washy-cli's
# release-auto-merge.yml.
#
# pull_request, not pull_request_target: this PR's branch lives on the
# repo itself, never a fork, so there's no untrusted checkout to guard
# against.
#
# GH_TOKEN below has to be RELEASE_TOKEN, not GITHUB_TOKEN: the merge
# commit this produces on main is itself GITHUB_TOKEN-authored if it
# isn't, and GitHub's anti-recursion guard then silently stops that merge
# from triggering release.yml (or any other workflow) at all, so the
# release would show "merged" but never actually get tagged or built.
# Confirmed live on washy-washy-cli (#188) and reproduced on
# hush-hush-action: a GITHUB_TOKEN auto-merge produced zero workflow runs
# on the merge commit.
name: release-auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # release-please labels its own pull request "autorelease: pending"
    # and re-labels it "autorelease: tagged" once merged -- checking the
    # label rather than the actor, since the PR is opened by whichever
    # identity runs googleapis/release-please-action, not a bot account.
    if: "contains(github.event.pull_request.labels.*.name, 'autorelease: pending')"
    runs-on: ubuntu-24.04
    steps:
      - name: Enable auto-merge for the release pull request
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
