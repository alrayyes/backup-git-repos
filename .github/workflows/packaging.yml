name: Packaging

# goreleaser check (lint.yml) only validates .goreleaser.yaml's syntax --
# it never builds or installs anything, so a broken .deb/.rpm or Nix flake
# passes it silently. This actually builds the nfpm packages and the Nix
# flake, installs the packages into a real (non-slim/non-minimal) base
# image each, and runs the installed binary from both.
on:
  push:
    branches: [main]
    paths:
      - .goreleaser.yaml
      - flake.nix
      - flake.lock
      - .github/workflows/packaging.yml
  pull_request:
    branches: [main]
    paths:
      - .goreleaser.yaml
      - flake.nix
      - flake.lock
      - .github/workflows/packaging.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-packages:
    name: Build .deb/.rpm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # release, not build: nfpm packaging is part of the release pipeline
      # stage, not the build one, so `goreleaser build` alone never
      # produces a .deb/.rpm. docker and aur are skipped because they need
      # registry/AUR credentials this job doesn't have and aren't what
      # this workflow is checking.
      - name: Build snapshot packages
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=docker,aur

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 1

  deb-install:
    name: Install & run (.deb)
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: debian@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1 # trixie
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: dist

      - name: Install and run
        run: |
          dpkg -i dist/backup-git-repos_*_linux_amd64.deb
          backup-git-repos version
          backup-git-repos --help >/dev/null

  rpm-install:
    name: Install & run (.rpm)
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: fedora@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d # 41
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: dist

      - name: Install and run
        run: |
          rpm -i dist/backup-git-repos_*_linux_amd64.rpm
          backup-git-repos version
          backup-git-repos --help >/dev/null

  nix-flake-check:
    name: Nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - run: nix flake check --print-build-logs

      - run: nix build --print-build-logs
