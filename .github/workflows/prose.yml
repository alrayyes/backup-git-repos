name: Prose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two jobs rather than one script running both, so a red pipeline says which
# tier failed. A grammar mistake is a mistake; a style alert is an opinion, and
# the two are answered differently.
env:
  VALE_VERSION: "3.17.1"
  LTEX_VERSION: "18.7.0"

permissions:
  contents: read

jobs:
  vale:
    name: Vale (style)
    runs-on: ubuntu-latest
    # Style advice reports, it does not gate. Blocking a merge on an opinion is
    # how a team learns to reach for --no-verify.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Vale is a Go binary, but its invocation lives in a bun script so the git
      # hook and this job cannot drift apart on which files get checked.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install Vale
        run: |
          curl -sSLf -o vale.tar.gz \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          tar -xzf vale.tar.gz vale
          sudo install -m 0755 vale /usr/local/bin/vale

      # The Google and proselint packages are downloaded, not committed, so this
      # has to run before the styles named in .vale.ini resolve.
      - name: Fetch style packages
        run: vale sync

      - name: Run Vale
        run: bun run lint:prose

  ltex:
    name: LTeX (grammar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ltex-cli-plus
        run: |
          curl -sSLf -o ltex.tar.gz \
            "https://github.com/ltex-plus/ltex-ls-plus/releases/download/${LTEX_VERSION}/ltex-ls-plus-${LTEX_VERSION}-linux-x64.tar.gz"
          tar -xzf ltex.tar.gz
          echo "$PWD/ltex-ls-plus-${LTEX_VERSION}/bin" >> "$GITHUB_PATH"

      # ltex-cli-plus exits 3 when it finds something, not 1, so a job that
      # tested for a specific code would pass a failing document.
      #
      # The file list is explicit rather than a glob: this is the prose we
      # write, and CHANGELOG.md is generated text that belongs to nobody's
      # grammar checker. Add new pages here as they appear.
      - name: Run LTeX
        env:
          # The archive ships its own JDK 21, which is the reason for taking the
          # -linux-x64 build, but its launcher only falls back to that JDK when
          # JAVA_HOME is empty. GitHub runners preset JAVA_HOME to Java 17, and
          # LTeX is compiled for 21, so it dies with UnsupportedClassVersionError
          # unless we clear it. Nothing else in this job wants Java.
          JAVA_HOME: ""
        run: ltex-cli-plus --client-configuration=.ltex.json README.md CONTRIBUTING.md
