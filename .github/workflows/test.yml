name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gotestsum wraps go test for the JUnit report Test Analytics needs,
      # on top of the same human-readable output go test already gave.
      - name: Test
        run: >-
          go tool gotestsum --junitfile junit.xml --
          -race -covermode=atomic -coverprofile=coverage.out ./...

      # GitHub withholds repository secrets from a pull_request run
      # dependabot[bot] triggers, so CODECOV_TOKEN is empty here and Codecov
      # rejects the upload outright ("Token required because branch is
      # protected") rather than silently skipping it -- there's no token to
      # retry with, so skip the step itself instead of failing the job on it.
      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: true

      # Assembled on every run, pull requests included, so a broken
      # conversion fails before the merge. Only the upload below is main-only.
      - name: Assemble reports
        if: ${{ !cancelled() }}
        run: scripts/assemble-reports.sh site/reports

      - name: Upload reports
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: site/reports
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Integration (Forgejo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # GitLab CE isn't run here or anywhere else in CI -- it wants several
      # minutes and several gigabytes, and the nightly lane that used to boot
      # it was a recurring source of unrelated red runs (#23, #123, #142,
      # #147, #157, #213) rather than caught regressions. `-tags='integration
      # gitlab'` still exists for a developer to run by hand against a live
      # container when touching the GitLab adapter; see CONTRIBUTING.md.
      # Forgejo boots in seconds, so it runs here.
      - name: Test
        run: go test -tags=integration -race ./...

  # One Pages deployment per repo, so this is the only job that deploys.
  # It runs on every push to main, whatever changed, because a deploy replaces
  # the whole site and a skipped run would delete the reports at the next one.
  pages:
    name: Pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [go, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reports
          path: site/reports

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # The deploy succeeds whether or not the URL serves the files, so fetch
      # the real ones. The retries cover the CDN catching up.
      - name: Check the live reports
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output junit.xml "${PAGE_URL%/}/reports/tests/junit.xml"
          grep -q '<testsuites' junit.xml
