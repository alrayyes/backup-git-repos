name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  gitlab:
    name: Integration (GitLab)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitLab CE unpacks to roughly 10 GB, more than a stock runner's free
      # disk comfortably holds alongside everything else already on it. This
      # has to run before Set up Go: /opt/hostedtoolcache is also where
      # setup-go installs the toolchain, so clearing it afterwards deletes
      # Go itself.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # go test defaults to a 10 minute deadline for the whole binary.
      # TestContainerBoots, TestListerContract and TestMirrorSync each boot
      # their own GitLab CE container from scratch (~4-5 minutes apiece), so
      # three of them run sequentially past that default well before any of
      # them actually hang -- confirmed by reproducing the same request
      # manually against a freshly booted container, where it answered in
      # under a second. 35m leaves headroom under the job's 45 minute cap
      # for checkout/setup/cleanup.
      - name: Test
        run: go test -tags="integration gitlab" -race -v -timeout=35m ./internal/gitlab/...
