name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  gitlab:
    name: Integration (GitLab)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitLab CE unpacks to roughly 10 GB, more than a stock runner's free
      # disk comfortably holds alongside everything else already on it. This
      # has to run before Set up Go: /opt/hostedtoolcache is also where
      # setup-go installs the toolchain, so clearing it afterwards deletes
      # Go itself.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -tags="integration gitlab" -race -v ./internal/gitlab/...
