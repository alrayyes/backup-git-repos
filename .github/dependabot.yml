version: 2
updates:
  # GitHub Actions. Changes the pipeline, not the artifact - releasing for this is noise.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      prefix-development: "ci"
      include: "scope"

  # Go modules. The tool itself is Go, so this ships in the binary - fix: cuts a patch
  # release the same way any other fix does, security-relevant or not.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      prefix-development: "fix"
      include: "scope"

  # bun dependencies. Tooling only - package.json exists for commitlint/biome/etc,
  # nothing here ships in the built binary. "bun", not "npm": the npm-ecosystem
  # updater doesn't understand bun.lock and only ever edits package.json,
  # which fails every job running `bun install --frozen-lockfile` (#195). The
  # dedicated bun ecosystem has no security-update support, unlike npm's, but
  # these are devDependencies only - `bun audit` in CI already flags a
  # vulnerable pin on every push, so there's nothing this loses in practice.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # The Dockerfile's base image. Ships in the published container, same
  # reasoning as gomod above - a bump here is fix:, not chore:.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      prefix-development: "fix"
      include: "scope"

  # flake.lock inputs (nixpkgs, flake-utils). Alternate packaging only -
  # goreleaser still builds the real distributed artifact, so a bump here
  # is tooling, not a fix to what ships.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
