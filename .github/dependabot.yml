version: 2
updates:
  # GitHub Actions. Changes the pipeline, not the artifact - releasing for this is noise.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      prefix-development: "ci"
      include: "scope"

  # Go modules. The tool itself is Go, so this ships in the binary - fix: cuts a patch
  # release the same way any other fix does, security-relevant or not.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      prefix-development: "fix"
      include: "scope"

  # npm/bun dependencies. Tooling only - package.json exists for commitlint/biome/etc,
  # nothing here ships in the built binary.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # The Dockerfile's base image. Ships in the published container, same
  # reasoning as gomod above - a bump here is fix:, not chore:.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      prefix-development: "fix"
      include: "scope"

  # flake.lock inputs (nixpkgs, flake-utils). Alternate packaging only -
  # goreleaser still builds the real distributed artifact, so a bump here
  # is tooling, not a fix to what ships.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
