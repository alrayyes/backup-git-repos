# pre-commit fixes and restages; pre-push only checks. A hook that rewrote files
# under a push would leave the pushed commit and your working tree disagreeing
# about what was reviewed.

pre-commit:
  parallel: true
  jobs:
    # `golangci-lint fmt` is the fixer in v2 -- gofumpt and goimports stopped
    # being linters and moved to the formatters block, so `run` is the check and
    # this is the write. Runs through the pinned golangci-lint image
    # (rules/go-lint.md) so the version a hook runs with matches CI's exactly,
    # rather than whatever happens to be on PATH.
    - name: golangci-lint-fmt
      glob: "*.go"
      run: bun run golangci-lint -- fmt {staged_files}
      stage_fixed: true

    # JSON and JSONC only. Go belongs to golangci-lint and Biome has no business
    # there. testdata/ is excluded here too, not just in biome.json: handed an
    # explicit staged-file list that's entirely ignored paths, Biome's CLI
    # errors out instead of skipping the way a glob scan does.
    - name: biome
      glob: "*.{json,jsonc}"
      exclude: "**/testdata/**"
      run: ./node_modules/.bin/biome check --write {staged_files}
      stage_fixed: true

    # Layout, then structure, in that order and never the other way round.
    # Prettier decides how the Markdown is laid out -- it is the only tool here
    # that formats a table -- and markdownlint then judges what Prettier
    # produced. Reversed, markdownlint would fix something Prettier is about to
    # overwrite. `piped` is what guarantees the order; the jobs would otherwise
    # run in parallel with the rest.
    - name: markdown
      glob: "*.md"
      group:
        piped: true
        jobs:
          - name: prettier
            run: ./node_modules/.bin/prettier --write {staged_files}
            stage_fixed: true

          - name: markdownlint
            run: ./node_modules/.bin/markdownlint-cli2 --fix {staged_files}
            stage_fixed: true

    # The YAML is Prettier's too -- Biome does not format it and nothing else
    # here does, so without this it drifts with whoever edited it last. Its own
    # job rather than a wider glob on the one above: markdownlint has no
    # business in a pipeline that ends at a .yml file.
    - name: prettier-yaml
      glob: "*.{yml,yaml}"
      run: ./node_modules/.bin/prettier --write {staged_files}
      stage_fixed: true

    # Style and clarity. Vale has no fixer -- rewriting someone's sentence is not
    # a hook's business -- so this reports and fails.
    #
    # Whole repo rather than the staged files, so the hook and CI run the
    # identical command and cannot drift. It takes well under a second.
    #
    # The style packages are downloaded rather than committed, so a fresh clone
    # has none. Sync once when they are missing rather than on every commit,
    # which would put a network round trip in front of every `git commit`.
    - name: vale
      glob: "*.md"
      run: |
        if [ ! -d styles/proselint ]; then
          ./node_modules/@vvago/vale/bin/vale sync
        fi
        ./node_modules/@vvago/vale/bin/vale --glob='!{styles,node_modules,.claude}/**' .

    - name: hadolint
      glob: "Dockerfile"
      run: bun run lint:dockerfile

    # hadolint reads the Dockerfile as text and never builds it, so a
    # syntactically fine Dockerfile can still fail to build
    # (rules/containers.md). Scoped to the Dockerfile plus whatever its
    # COPY instruction actually needs -- go.mod/go.sum for module
    # resolution and every *.go file, since scripts/docker-build-check.sh
    # cross-compiles the binary it stages, the same way goreleaser does
    # for the real image.
    - name: docker-build
      glob: "{Dockerfile,**/*.go,go.mod,go.sum}"
      run: bun run build:docker

    # Keeps package.json itself canonical the way Prettier does for
    # everything else -- see rules/javascript.md.
    - name: sort-package-json
      glob: "package.json"
      run: ./node_modules/.bin/sort-package-json {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: ./node_modules/.bin/commitlint --edit {1}

# Every linter again, in check mode over the whole tree rather than the staged
# set, plus the fast suite. The commit hook only ever saw the files you touched.
#
# The container suite is the deliberate omission. `go test -tags=integration`
# boots a real Forgejo, which is more than a push should wait on; CI runs it on
# every pull request. `-tags='integration gitlab'` boots GitLab CE and is
# nightly-only. Run either by hand when you have touched an adapter.
#
# ltex-cli-plus is the other omission: a 305 MB download shipping its own Java
# is more than a push should wait on. CI runs it, and the editor runs the same
# engine over LSP, so it is caught earlier than here anyway.
pre-push:
  parallel: true
  jobs:
    - name: golangci-lint
      run: bun run golangci-lint -- run

    - name: go-test
      run: bun run go -- test -race ./...

    - name: biome
      run: ./node_modules/.bin/biome check

    # `--check` rather than `--write`: it reports what is misformatted and
    # fails, leaving the files alone. Split the same way CI splits it, so a red
    # job says which of the two went out of shape.
    - name: prettier
      run: ./node_modules/.bin/prettier --check '**/*.md'

    - name: prettier-yaml
      run: ./node_modules/.bin/prettier --check '**/*.{yml,yaml}'

    - name: markdownlint
      run: ./node_modules/.bin/markdownlint-cli2

    - name: vale
      run: ./node_modules/@vvago/vale/bin/vale --glob='!{styles,node_modules,.claude}/**' .

    - name: hadolint
      run: bun run lint:dockerfile

    - name: docker-build
      run: bun run build:docker

    - name: sort-package-json
      run: ./node_modules/.bin/sort-package-json --check package.json

    # go.mod's own canonicalizer -- gofmt never touches it. No built-in
    # check-only flag, so diff against what -fmt would produce. The edit
    # itself runs in the pinned image (rules/go.md); the diff check stays on
    # the host, since git isn't in that image and doesn't need to be.
    - name: go-mod-fmt
      run: |
        bun run go -- mod edit -fmt go.mod
        git diff --exit-code go.mod

    # Broader than -mod=readonly's missing-require check: a stale require
    # go build/test won't fail on, a non-canonical version string, a
    # go.sum entry nothing imports anymore. Network only when something's
    # missing from a warm module cache -- heavier than pure formatting,
    # which is why it's here and not pre-commit.
    - name: go-mod-tidy
      run: bun run go -- mod tidy -diff
