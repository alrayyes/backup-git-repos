StylesPath = styles
MinAlertLevel = warning

# Downloaded by `vale sync`, not committed. The two directories they land in are
# ignored by name in .gitignore, so styles/House/ and styles/config/ stay
# tracked with them.
Packages = Google, proselint

# Holds the spellings this project insists on — Forgejo, GitLab, goreleaser and
# the rest. Without it the spell-checker flags every one of them. Vale treats
# Vocab as a core option, so it has to sit above the syntax sections below.
Vocab = House

[*.md]
BasedOnStyles = Vale, Google, proselint, House

# Enforces the casing in that vocabulary, so "Gitlab" and "forgejo" are flagged
# where GitLab and Forgejo are the accepted forms.
Vale.Terms = YES

# The prose here is British English. Google's style guide is written for
# American spelling and would flag every "behaviour" in the file.
Google.Spelling = NO

# The first person plural is fine in a README that explains a decision.
Google.We = NO

# The house style is a spaced em dash — like this one. Google's rule wants them
# closed up, which would rewrite every aside in the file.
Google.EmDash = NO

# release-please writes this file from commit subjects. Generated text belongs
# to nobody's style guide, and the pre-commit hook passes staged files
# explicitly rather than by glob, so the exclusion has to live here to apply in
# both places. Vale.Terms is a core feature tied to Vocab rather than a style,
# so clearing BasedOnStyles alone doesn't turn it off -- without this line a
# commit subject naming a lowercase module path like
# "github.com/stretchr/testify" still gets flagged for not capitalizing
# "GitHub" in the middle of what is, there, a Go import path.
[CHANGELOG.md]
BasedOnStyles =
Vale.Terms = NO
